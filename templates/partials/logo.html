{#- Override: the theme shows the logo image *or* the title; we show both. -#}
<a href="{{ get_url(path='/', lang=lang) }}">
    <span class="logo">
        {%- if config.extra.header_logo -%}
        <img class="img-logo" src="{{ get_url(path=config.extra.header_logo, cachebust=true) }}" alt="">
        {%- endif -%}
        {{ config.extra.header_title | default(value=config.title) | safe }}
    </span>
</a>
