# The URL the site will be built for
base_url = "https://irlug.github.io/"

title = "IrLUG"
description = "IrLUG è un'associazione senza scopo di lucro nata per diffondere la cultura del free software e dell'open source in Irpinia e dintorni"

theme = "terminus"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# When set to "true", a feed is automatically generated.
generate_feeds = true

# The default author for pages
author = "IrLUG"

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true


[markdown]

# When set to "true", emoji aliases translated to their corresponding
# Unicode emoji equivalent in the rendered Markdown files. (e.g.: :smile: => 😄)
render_emoji = true

# Whether footnotes are rendered in the GitHub-style (at the bottom, with back references) or plain (in the place, where they are defined)
bottom_footnotes = true

[markdown.highlighting]
# Whether to use inline hex colours ("inline") or CSS classes ("class").
# See https://www.getzola.org/documentation/content/syntax-highlighting/ for details.
style = "inline"

# Eyal: Use a slightly patched version of the Monokai theme that plays more nicely with Rust.
# Long term solution is to improve the Rust grammar used by VSCode/Giallo, which is lacking:
# https://github.com/dustypomerleau/rust-syntax
extra_themes = ["themes/terminus/syntaxes/monokai-classic.json"]

# The theme to use for code highlighting.
# See https://github.com/getzola/giallo?tab=readme-ov-file#themes for the list of allowed values.
theme = "monokai-classic"

[extra]
color_scheme = "irpinia"
close_responsive_menu_on_resize = true
copy_button = true
favicon_emoji = "👨‍💻"
layout = "center"
show_default_author = false

main_menu = [
    { name = "blog", url = "blog", trailing_slash = true },
    { name = "old", url = "/old", new_tab = true },
]

socials = [
    { name = "email", url = "mailto:info@irlug.it" },
    { name = "github", url = "https://github.com/irlug" },
    { name = "youtube", url = "https://www.youtube.com/channel/UCg0SEu8SEFB9bh72WfYL_Vg" },
    { name = "instagram", url = "https://www.instagram.com/irpinialug/" },
    { name = "telegram", url = "https://t.me/irlug" },
    { name = "facebook", url = "https://www.facebook.com/IrLUG" },
    { name = "flickr", url = "https://www.flickr.com/photos/140926019@N05/albums" },
]

stylesheets = [
    "css/logo.css"
]

[extra.responsive_images]
widths = [640, 784, 1280, 1920, 2560]
fallback_width = 1280
